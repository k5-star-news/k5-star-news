<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 5px; }
    .grid { display: flex; flex-direction: column; gap: 20px; }
    .card { background: transparent; border: none; padding: 0; }
    .head { font-size: 1.1rem; font-weight: 900; margin: 0 0 10px 0; border-bottom: 2px solid #333; padding-bottom: 5px; color: #fff; }
    .empty { color: #666; font-size: 0.9rem; text-align: center; padding: 20px 0; font-weight: bold; }
    .item { display: flex; border-bottom: 1px solid #1a1a1a; padding: 8px 0; }
    .item-list:not(.show-all) .hide-default { display: none; }
    .l-m { flex: 1; text-decoration: none; padding-right: 5px; }
    .t { font-size: 1.05rem; font-weight: 900; line-height: 1.4; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tm { font-size: 0.8rem; color: #999; margin-left: 6px; white-space: nowrap; font-weight: normal; }
    .s { font-size: 0.9rem; color: #ccc; font-weight: 500; line-height: 1.3; }
    .b-p { display: flex; align-items: center; justify-content: center; color: #ffcc00; width: 44px; cursor: pointer; border-left: 1px solid #222; font-size: 1.2rem; user-select: none; }
    .more-btn { text-align: center; padding: 12px; color: #33b5e5; font-size: 0.9rem; font-weight: bold; cursor: pointer; background: #1a1a1a; border-radius: 8px; margin-top: 10px; user-select: none; }
    @media (min-width: 900px) { 
      body { padding: 20px; } 
      .grid { display: grid; grid-template-columns: repeat(5, 1fr); align-items: start; gap: 15px; } 
      .card { background: #0c0c0c; padding: 15px; border-radius: 12px; border: 1px solid #222; display: flex; flex-direction: column; max-height: 85vh; }
      .item-list { overflow-y: auto; flex-grow: 1; padding-right: 5px; }
      .item-list::-webkit-scrollbar { width: 4px; }
      .item-list::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
      .item-list:not(.show-all) .hide-default { display: flex; }
    }
  </style>
  <script>
    const W = "https://script.google.com/macros/s/AKfycbzzBma248sj2VobvggeD6wsZRMBLoyKlYlcCGKwHgfExleSGsC6H389ZNygtA2nux6Q/exec";
    function savePin(u,t,b){ if(b.innerText==="✔")return; b.innerText="✔"; b.style.color="#555"; fetch(W+"?action=pin&url="+encodeURIComponent(u)+"&title="+encodeURIComponent(t),{mode:'no-cors'}); }
    function showMore(id){ 
      document.getElementById('list-'+id).classList.add('show-all'); 
      document.getElementById('btn-'+id).style.display='none'; 
    }
  </script></head><body>
